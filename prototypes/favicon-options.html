<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favicon — options</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B14;--surface:#0E1424;--ink:#ECEAE4;--muted:#8A93A8;--dim:#5E6A85;--line:rgba(236,234,228,.10);--accent-hi:#8E9BFF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;padding:clamp(20px,4vw,56px);-webkit-font-smoothing:antialiased}
h1{font-weight:600;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.05em;line-height:1}
.sub{margin-top:12px;color:var(--muted);max-width:38em;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:40px}
.card{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:24px}
.tag{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--dim)}
.card h2{margin:6px 0 4px;font-weight:600;font-size:1.4rem;letter-spacing:-.03em}
.card p{color:var(--muted);font-size:.95rem;line-height:1.5;min-height:4.5em}
.big{margin:20px 0}
.big svg{width:112px;height:112px;display:block}
.sizes{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-top:8px;font-size:12.5px}
.strip.dk{background:#202124;color:#e8eaed}
.strip.lt{background:#dee1e6;color:#202124}
.strip svg{width:16px;height:16px;flex:none}
.reco{color:var(--accent-hi)}
</style>
</head>
<body>
<h1>Favicon — 3 options</h1>
<p class="sub">Chaque option est montrée en grand, à 32 px et 16 px, puis dans un onglet de navigateur sombre et clair. Jugez à 16 px : c'est la taille réelle.</p>
<div class="grid" id="g"></div>
<script>
const OPT=[
 {k:'B',n:'Le C et le point',r:1,d:'Votre initiale, avec le point bleu du graphique du hero dans son ouverture. Personnel et lisible à 16 px.',
  svg:'<rect width="64" height="64" rx="12" fill="#070B14"/><path d="M48.85 17.86A22 22 0 1 0 48.85 46.14" fill="none" stroke="#ECEAE4" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="32" r="6.5" fill="#8E9BFF"/>'},
 {k:'A',n:'Le signal',d:'La courbe en S de votre hero, avec le point de la régression locale. Le plus « data », mais il ne porte pas votre nom.',
  svg:'<rect width="64" height="64" rx="14" fill="#070B14"/><path d="M10 47C24 47 26 32 32 32S40 17 54 17" fill="none" stroke="#ECEAE4" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="6.5" fill="#8E9BFF"/>'},
 {k:'C',n:'Le ×',d:'Le signe de Data × Code × Product. Fidèle au concept, mais proche d’un bouton « fermer » dans un onglet.',
  svg:'<rect width="64" height="64" rx="14" fill="#070B14"/><path d="M20 20L44 44M44 20L20 44" stroke="#8E9BFF" stroke-width="7" stroke-linecap="round"/>'}
];
const s=(o,px)=>`<svg viewBox="0 0 64 64" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">${o.svg}</svg>`;
document.getElementById('g').innerHTML=OPT.map(o=>`<div class="card">
 <div class="tag">OPTION ${o.k}${o.r?' · <span class="reco">RECOMMANDÉE</span>':''}</div><h2>${o.n}</h2><p>${o.d}</p>
 <div class="big">${s(o,112)}</div>
 <div class="sizes">${s(o,64)}${s(o,32)}${s(o,16)}</div>
 <div class="strip dk">${s(o,16)}<span>Cheikh Darou Beye — Portfolio</span></div>
 <div class="strip lt">${s(o,16)}<span>Cheikh Darou Beye — Portfolio</span></div>
</div>`).join('');
</script>
</body>
</html>
